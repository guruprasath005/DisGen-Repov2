name: disgen

networks:
  disgen_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chromadb_data:
  grafana_data:
  prometheus_data:
  backup_data:

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [disgen_net]
    environment:
      POSTGRES_USER: disgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: disgen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disgen -d disgen"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / Broker ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [disgen_net]
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── File Storage ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    networks: [disgen_net]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  # ── Vector DB ─────────────────────────────────────────────────────────────
  # Server tag MUST match the major version of the chromadb pip client in
  # backend/requirements.txt — version mismatch (e.g. server 0.6.x with a
  # 1.x client) causes silent collection-create failures with KeyError('_type').
  chromadb:
    image: chromadb/chroma:1.0.16
    restart: unless-stopped
    networks: [disgen_net]
    volumes:
      - chromadb_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [disgen_net]
    env_file: .env
    volumes:
      - ./backend/auth/keys:/app/auth/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [disgen_net]
    command: celery -A tasks.celery_app worker --loglevel=info -Q ocr,generate,maintenance --concurrency=2
    env_file: .env
    volumes:
      - ./backend/auth/keys:/app/auth/keys:ro
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [disgen_net]
    command: celery -A tasks.celery_app beat --loglevel=info
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (TLS termination + reverse proxy) ───────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    networks: [disgen_net]
    ports:
      - "${DISGEN_PORT_HTTP:-80}:80"
      - "${DISGEN_PORT_HTTPS:-443}:443"
      - "${DISGEN_PORT_MOBILE:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.3.1
    restart: unless-stopped
    networks: [disgen_net]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    networks: [disgen_net]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ── GlitchTip (error tracking) ────────────────────────────────────────────
  glitchtip_migrate:
    image: glitchtip/glitchtip:v4.1
    networks: [disgen_net]
    command: ./bin/run-migrate.sh
    environment:
      DATABASE_URL: postgresql://disgen:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  glitchtip_web:
    image: glitchtip/glitchtip:v4.1
    restart: unless-stopped
    networks: [disgen_net]
    environment:
      DATABASE_URL: postgresql://disgen:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost}
      DEFAULT_FROM_EMAIL: glitchtip@disgen.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip_migrate:
        condition: service_completed_successfully

  glitchtip_worker:
    image: glitchtip/glitchtip:v4.1
    restart: unless-stopped
    networks: [disgen_net]
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgresql://disgen:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Automated Backups ─────────────────────────────────────────────────────
  postgres_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    networks: [disgen_net]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: disgen
      POSTGRES_USER: disgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
