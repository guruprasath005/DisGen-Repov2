worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Use Docker's internal DNS resolver so upstream hostnames are re-resolved
    # on every request instead of being cached at startup. Without this, nginx
    # caches the backend container's IP at boot — if the container restarts and
    # gets a new IP, all proxied requests return 502 until nginx itself restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS — main web interface ────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/disgen.crt;
        ssl_certificate_key /etc/nginx/certs/disgen.key;
        ssl_protocols       TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # nginx: a server block with its own add_header directives does NOT inherit
        # the http-block add_header directives — all headers must be listed here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        root /usr/share/nginx/html;
        index index.html;

        # Prometheus metrics are scraped over the internal docker network only.
        # Block any external request so the SPA fallback doesn't accidentally
        # serve index.html (HTTP 200) for /metrics — and so the path can never
        # become a leak if a future change adds a proxy by mistake.
        location ^~ /metrics {
            return 404;
        }

        # Long-running routes — OCR and generation can take minutes (matched first)
        location ~ ^/api/(documents|generate)/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID $request_id;
            proxy_read_timeout 700s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 700s;
        }

        # API — strip /api prefix when proxying to FastAPI
        location /api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID $request_id;
            proxy_read_timeout 120s;
        }

        # Grafana (internal only, path-based)
        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            rewrite ^/grafana(/.*)$ $1 break;
            proxy_pass         $grafana_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # React SPA — all other routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Plain HTTP — React Native LAN access (port 8080) ─────────────────────
    # No TLS — for mobile app on the same local network only.
    server {
        listen 8080;
        server_name _;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # CORS — required for React Native / Expo clients on the LAN
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-CSRF-Token, X-Request-ID" always;

        # Block /metrics on the mobile-API port too (same reasoning as 443).
        location ^~ /metrics {
            return 404;
        }

        # Handle CORS preflight before proxying
        location = /api/auth/login {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*";
                add_header Access-Control-Allow-Methods "POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                return 204;
            }
            set $backend_upstream http://backend:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID $request_id;
            proxy_read_timeout 30s;
        }

        location ~ ^/api/(documents|generate)/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 700s;
        }

        location /api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Request-ID $request_id;
            proxy_read_timeout 700s;
        }
    }
}
